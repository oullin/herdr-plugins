id = "oullin.tab-numbers"
name = "Tab Numbers"
version = "0.1.5"
min_herdr_version = "0.7.0"
description = "Show contiguous position numbers in named Herdr tab labels"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "sync"
title = "Sync tab numbers"
description = "Re-index every named tab with contiguous position numbers"
contexts = ["global"]
command = ["node", "index.ts"]

[[events]]
on = "tab.created"
command = ["node", "index.ts"]

[[events]]
on = "tab.renamed"
command = ["node", "index.ts"]

[[events]]
on = "tab.closed"
command = ["node", "index.ts"]

[[events]]
on = "tab.moved"
command = ["node", "index.ts"]
