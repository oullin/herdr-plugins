id = "oullin.tab-numbers"
name = "Tab Numbers"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Show stable Herdr tab numbers in named tab labels"
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "sync"
title = "Sync tab numbers"
description = "Add stable Herdr numbers to every named tab"
contexts = ["global"]
command = ["node", "index.mjs"]

[[events]]
on = "tab.created"
command = ["node", "index.mjs"]

[[events]]
on = "tab.renamed"
command = ["node", "index.mjs"]
