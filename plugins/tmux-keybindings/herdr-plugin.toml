id = "oullin.tmux-keybindings"
name = "Tmux Keybindings"
version = "0.2.0"
min_herdr_version = "0.7.4"
description = "Apply a canonical tmux keymap and open a modal binding reference"
platforms = ["linux", "macos", "windows"]

[[build]]
command = [
  "npm",
  "install",
  "--omit=dev",
  "--ignore-scripts",
  "--no-audit",
  "--no-fund",
  "--no-package-lock",
  "--workspaces=false",
]

[[actions]]
id = "apply"
title = "Apply tmux keybindings"
description = "Apply the canonical tmux keybinding profile"
contexts = ["global"]
command = ["node", "index.ts", "apply"]

[[actions]]
id = "toggle"
title = "Open tmux keybinding dialog"
description = "Open the modal keybinding reference for the active pane"
contexts = ["global"]
command = ["node", "index.ts", "toggle"]

[[actions]]
id = "restore"
title = "Restore keybindings"
description = "Restore the keybindings replaced by this plugin"
contexts = ["global"]
command = ["node", "index.ts", "restore"]

[[events]]
on = "workspace.created"
command = ["node", "index.ts", "apply", "--automatic"]

[[panes]]
id = "bindings"
title = "Tmux keybindings"
placement = "popup"
width = 84
height = 24
command = ["node", "index.ts", "bindings"]
